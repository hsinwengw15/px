name: Update margin data

# 每個交易日晚上自動計算上市融資維持率，寫入 idx/data/margin.csv
on:
  schedule:
    - cron: "17 14 * * 1-5" # 台灣時間週一到週五 22:17（證交所融資資料晚上才公布）
  workflow_dispatch:
    inputs:
      backfill_days:
        description: "回補過去幾天（0 = 只檢查最近 7 天）"
        default: "0"
  push:
    paths:
      - "scripts/margin.mjs"
      - ".github/workflows/margin-data.yml"

permissions:
  contents: write

concurrency:
  group: margin-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - name: Compute margin maintenance ratio
        env:
          # 腳本有改（push）時回補一年；排程只檢查最近 7 天
          BACKFILL_DAYS: ${{ github.event_name == 'push' && '370' || inputs.backfill_days || '0' }}
        run: node scripts/margin.mjs
      - name: Commit data
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add idx/data/margin.csv
          if git diff --cached --quiet; then
            echo "沒有新資料"
          else
            git commit -m "Update margin data"
            git push
          fi
